# Item 17: XDG Desktop Portal priority config for Hyprland
# Ensures screen sharing works correctly in Discord, OBS, browsers.
# This file is read by xdg-desktop-portal to determine which implementation
# handles each interface.
#
# Format: interface=portal1;portal2
# The first portal in the list that implements the interface is used.

[preferred]
# Screen capture — must be hyprland, not gtk (gtk doesn't support pipewire screenshare)
org.freedesktop.portal.ScreenCast=hyprland
org.freedesktop.portal.Screenshot=hyprland

# Remote desktop — hyprland for Wayland-native apps
org.freedesktop.portal.RemoteDesktop=hyprland

# File chooser — gtk for best compatibility with GUI apps
org.freedesktop.portal.FileChooser=gtk

# App chooser, settings, secret — gtk
org.freedesktop.portal.AppChooser=gtk
org.freedesktop.portal.Settings=gtk
org.freedesktop.portal.Secret=gnome-keyring

# Notification — prefer gtk for wide compat
org.freedesktop.portal.Notification=gtk

# Default fallback: try hyprland first, then gtk
default=hyprland;gtk
